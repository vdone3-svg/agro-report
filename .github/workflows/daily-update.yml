name: Daily Dashboard Update

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone --version

      - name: Configure rclone (OneDrive особистий)
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF }}" | base64 --decode > ~/.config/rclone/rclone.conf

      # Завантаження з OneDrive робить сам парсер: бере папку сьогоднішньої дати
      # (ДД.ММ), а якщо її ще нема — найновішу (сортування за місяцем і днем).
      - name: Download + parse data
        run: |
          python3 fetch_and_parse.py
          echo "Файли:"; ls -la data_files/*/ || true

      - name: Build HTML
        run: python3 build_html.py

      - name: Check data is not empty
        run: |
          python3 - << 'PY'
          import json
          d = json.load(open("data.json", encoding="utf-8"))
          f, w, h = d.get("fuel", {}), d.get("worktime", {}), d.get("harvest", {})
          checks = {
              "паливо (заправки)": len(f.get("monthly", {})),
              "баланс палива": len(f.get("balance_history", [])),
              "облік робіт": len(w.get("records", [])) if len(w.get("records", [])) >= 50 else 0,
              "косіння (записи)": len(h.get("records", [])),
              "довідник полів": len(h.get("fields", [])),
          }
          print("data_date:", d.get("data_date"), checks)
          # Короткий підсумок у анотації запуску (видно в GitHub без логів)
          import glob, os
          folder = ",".join(sorted(os.path.basename(p) for p in glob.glob("data_files/*")))
          m = d["data_date"][:7]
          pet = set(f.get("petrol_machines", []))
          dp = sum(v for k, ds in f.get("monthly", {}).items() if k not in pet for dd, v in ds.items() if dd.startswith(m))
          bal = (f.get("balance") or {}).get("display_dp") or 0
          t = h.get("totals", {})
          print(f"::notice title=Звіт::папка {folder}; дані на {d['data_date']}; ДП за місяць {dp:.0f} л; "
                f"залишок ДП {bal:.0f} л; соняшник {t.get('sunflower_kg',0)/1000:.1f} т / {t.get('sunflower_ha',0):.0f} га; "
                f"кукурудза {t.get('corn_kg',0)/1000:.1f} т / {t.get('corn_ha',0):.0f} га; "
                f"пшениця {t.get('wheat_kg',0)/1000:.1f} т; записів робіт {checks['облік робіт']}; полів {checks['довідник полів']}; "
                f"файли: {d.get('source_files')}; у папці: {sorted(os.path.basename(x) for x in glob.glob('data_files/*/*'))}")
          bad = [k for k, v in checks.items() if not v]
          assert not bad, f"Порожні блоки: {bad}"
          PY

      # На сайт іде ТІЛЬКИ дашборд. xlsx і data.json (прізвища, паливо, склад)
      # не публікуються.
      - name: Prepare site
        run: |
          mkdir -p public
          cp index.html public/index.html
          ls -la public/

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npm install -g netlify-cli
          netlify deploy --prod --dir=public --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN

      # Перевірка після деплою — якщо щось не так, запуск позначиться як failed
      - name: Verify live site
        run: |
          sleep 10
          URL=https://dolynske-report.netlify.app
          curl -sf "$URL/" -o live.html
          grep -q '"crop_plan"' live.html || { echo "На сайті стара версія"; exit 1; }
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/data.json")
          echo "data.json -> $CODE"
          test "$CODE" = "404" || { echo "data.json досі публічний"; exit 1; }

      - name: Keep copy of published dashboard
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: public/index.html
          retention-days: 3
